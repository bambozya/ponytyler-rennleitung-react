# Publishes the demo to GitHub Pages: the React app with a fake backend that runs in the browser
# (ui/rl-react/src/demo). The real app, with the NestJS backend, runs on the Pi and is not deployed here.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            be/package-lock.json
            ui/rl-react/package-lock.json

      # The frontend takes its API types from the backend's generated Prisma client.
      # Install scripts are skipped: nothing native (USB, serial port) is needed to generate types.
      - name: Generate backend types
        working-directory: be
        run: |
          npm ci --ignore-scripts
          npx prisma migrate deploy
          npx prisma generate --sql

      - name: Build the demo
        working-directory: ui/rl-react
        env:
          VITE_DEMO: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          # Pages has no rewrite rules: deep links are answered with 404.html, which is the app itself.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/rl-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
